name: Build MKS 5 MP APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu götür
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: HTML layihəsini hazırla
        run: |
          mkdir -p project/app/src/main/assets
          mkdir -p project/app/src/main/java/com/mks5mp/builder
          mkdir -p project/app/src/main/res/values

          cp *.html project/app/src/main/assets/index.html || true

      - name: APK yarat
        run: |
          echo "APK build sistemi hazırlandı"
